name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf build
      - run: buf lint
      - run: buf format --diff --exit-code
      - name: Check protobuf backward compatibility
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            buf breaking --against ".git#tag=$PREV_TAG"
          else
            echo "Skipping buf breaking: no earlier release tag"
          fi

  notify-consumers:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch validated release
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_REPOS_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api --method POST repos/Nasam-Main/nasam-tracking/dispatches \
            -f event_type=telemetry-rpc-released \
            -F client_payload[tag]="$GITHUB_REF_NAME"
          gh api --method POST repos/Nasam-Main/nasam-v2-api/dispatches \
            -f event_type=telemetry-rpc-released \
            -F client_payload[tag]="$GITHUB_REF_NAME"
